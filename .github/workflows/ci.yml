# Esteira de CI do PlantãoSeguro. Roda em todo PR para a main e em push na main.
# Entra numa fase seguinte: e2e (Fase 4).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  segredos:
    name: Segredos e material do professor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .env e docs/aulas não podem estar versionados
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v -E '\.env\.example$'; then
            echo "::error::Arquivo .env versionado."; exit 1
          fi
          if git ls-files | grep -E '^docs/aulas/'; then
            echo "::error::Material do professor (docs/aulas) versionado."; exit 1
          fi

      - name: Padrões de chaves conhecidos
        run: |
          # Google/Gemini (AIza), Anthropic (sk-ant-), JWT (chaves do Supabase), token de bot do Telegram
          # e tokens de acesso da Vercel (vcp_) e do Supabase (sbp_).
          if git grep -nIE '(AIza[0-9A-Za-z_-]{35}|sk-ant-[A-Za-z0-9_-]{20,}|eyJ[A-Za-z0-9_-]{30,}\.[A-Za-z0-9_-]{30,}\.[A-Za-z0-9_-]{10,}|[0-9]{8,10}:AA[A-Za-z0-9_-]{30,}|vcp_[A-Za-z0-9]{20,}|sbp_[A-Za-z0-9_]{20,})' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::Possível segredo no repositório."; exit 1
          fi

  python:
    name: Lint e testes (matching-api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/matching-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/matching-api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Testes (pytest)
        run: python -m pytest -q

  neutralidade:
    name: Neutralidade econômica (Res. CFM 2.460)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/matching-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/matching-api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Pagamento e valor do plantão não podem entrar no ranking
        run: python -m pytest -q tests/test_neutralidade_economica.py

  poc:
    name: PoC mínima (dados, avaliação e demonstração)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/matching-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gera os dados sintéticos e o relatório de qualidade
        run: python -m app.cli seed --report /tmp/evidencias/relatorio-de-qualidade.md
      - name: Treina e avalia o ranking (simulação)
        run: python -m app.cli evaluate --report-dir /tmp/evidencias/resultados
      - name: Fluxo recomendado contra o processo manual (simulação)
        run: python -m app.cli flow --report-dir /tmp/evidencias/resultados
      - name: Teste de premissas e simulação de lançamento (simulação)
        run: python -m app.cli robustness --report-dir /tmp/evidencias/resultados
      - name: Casos da revisão às cegas iguais aos publicados (informativo, não reprova)
        continue-on-error: true
        run: |
          python -m app.cli blind-review --out /tmp/evidencias/entrevistas
          diff /tmp/evidencias/entrevistas/revisao-cega-casos.md ../../docs/entrevistas/revisao-cega-casos.md
          diff /tmp/evidencias/entrevistas/revisao-cega-gabarito.md ../../docs/entrevistas/revisao-cega-gabarito.md
      - name: Demonstração com aprovação e trilha de auditoria
        run: |
          mkdir -p /tmp/evidencias
          python -m app.cli demo --yes --fresh | tee /tmp/evidencias/demo.txt
      - name: Análise exploratória
        run: python -m app.cli analyze --out /tmp/evidencias/analise
      - name: Reprodutibilidade entre máquinas (informativo, não reprova)
        continue-on-error: true
        run: |
          python - <<'EOF'
          import json, pathlib
          ci = json.loads(pathlib.Path("../../data/synthetic/out/dataset_manifest.json").read_text())
          autor = json.loads(pathlib.Path("../../docs/dados/manifesto-da-geracao.json").read_text())
          same_counts = ci["row_counts"] == autor["row_counts"]
          same_hashes = ci["sha256"] == autor["sha256"]
          print("contagens iguais às da máquina do autor:", same_counts)
          print("checksums dos CSV iguais às da máquina do autor:", same_hashes)
          raise SystemExit(0 if same_counts and same_hashes else 1)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: poc-evidencias
          path: |
            /tmp/evidencias
            data/synthetic/out/audit_log.jsonl
            data/synthetic/out/dataset_manifest.json
            data/synthetic/out/model_registry.json

  compose:
    name: Validação do Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: docker compose --env-file .env.example -f infra/docker-compose.yml config -q

  banco:
    name: Banco (migrações, RLS e auditoria)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 3.0.0
      - name: Sobe o Postgres do Supabase e aplica as migrações
        run: supabase db start
      - name: Testes de RLS e auditoria (pgTAP)
        run: supabase test db
      - name: Os dados sintéticos cabem nas regras do banco
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -f scripts/carregar-amostra-banco.sql
      - name: Alertas de segurança e desempenho do Supabase
        run: supabase db advisors --level info --fail-on warn
      - name: Erros de tipo nas funções do banco
        run: supabase db lint --level warning --fail-on warning

  web:
    name: Interface web (lint, tipos, testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Tipos (TypeScript)
        run: npm run typecheck
      - name: Contraste das cores (WCAG)
        run: npm run check:contraste
      - name: Testes de componente (Vitest)
        run: npm test
      - name: Build (Next.js)
        run: npm run build

  web-e2e:
    name: Interface web (jornada e acessibilidade)
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: 1
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium
      - name: Build (Next.js)
        run: npm run build
      - name: Jornada e axe (Playwright)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-e2e-relatorio
          path: |
            apps/web/playwright-report
            apps/web/test-results
