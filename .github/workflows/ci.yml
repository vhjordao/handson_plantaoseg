# Esteira de CI do PlantãoSeguro. Roda em todo PR para a main e em push na main.
# Entram nas fases seguintes: web (lint e build, Fase 3), SQL/RLS (Fase 1) e e2e (Fase 4).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  segredos:
    name: Segredos e material do professor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .env e docs/aulas não podem estar versionados
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v -E '\.env\.example$'; then
            echo "::error::Arquivo .env versionado."; exit 1
          fi
          if git ls-files | grep -E '^docs/aulas/'; then
            echo "::error::Material do professor (docs/aulas) versionado."; exit 1
          fi

      - name: Padrões de chaves conhecidos
        run: |
          # Google/Gemini (AIza), Anthropic (sk-ant-), JWT (chaves do Supabase) e token de bot do Telegram.
          if git grep -nIE '(AIza[0-9A-Za-z_-]{35}|sk-ant-[A-Za-z0-9_-]{20,}|eyJ[A-Za-z0-9_-]{30,}\.[A-Za-z0-9_-]{30,}\.[A-Za-z0-9_-]{10,}|[0-9]{8,10}:AA[A-Za-z0-9_-]{30,})' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::Possível segredo no repositório."; exit 1
          fi

  python:
    name: Lint e testes (matching-api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/matching-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/matching-api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Testes (pytest)
        run: python -m pytest -q

  neutralidade:
    name: Neutralidade econômica (Res. CFM 2.460)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/matching-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/matching-api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Pagamento e valor do plantão não podem entrar no ranking
        run: python -m pytest -q tests/test_neutralidade_economica.py

  poc:
    name: PoC mínima (dados, avaliação e demonstração)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/matching-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gera os dados sintéticos e o relatório de qualidade
        run: python -m app.cli seed --report /tmp/evidencias/relatorio-de-qualidade.md
      - name: Treina e avalia o ranking (simulação)
        run: python -m app.cli evaluate --report-dir /tmp/evidencias/resultados
      - name: Demonstração com aprovação e trilha de auditoria
        run: |
          mkdir -p /tmp/evidencias
          python -m app.cli demo --yes --fresh | tee /tmp/evidencias/demo.txt
      - name: Análise exploratória
        run: python -m app.cli analyze --out /tmp/evidencias/analise
      - name: Reprodutibilidade entre máquinas (informativo, não reprova)
        continue-on-error: true
        run: |
          python - <<'EOF'
          import json, pathlib
          ci = json.loads(pathlib.Path("../../data/synthetic/out/dataset_manifest.json").read_text())
          autor = json.loads(pathlib.Path("../../docs/dados/manifesto-da-geracao.json").read_text())
          same_counts = ci["row_counts"] == autor["row_counts"]
          same_hashes = ci["sha256"] == autor["sha256"]
          print("contagens iguais às da máquina do autor:", same_counts)
          print("checksums dos CSV iguais às da máquina do autor:", same_hashes)
          raise SystemExit(0 if same_counts and same_hashes else 1)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: poc-evidencias
          path: |
            /tmp/evidencias
            data/synthetic/out/audit_log.jsonl
            data/synthetic/out/dataset_manifest.json
            data/synthetic/out/model_registry.json

  compose:
    name: Validação do Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: docker compose --env-file .env.example -f infra/docker-compose.yml config -q
