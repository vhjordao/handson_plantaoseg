# Comparação da regressão logística com o LightGBM (roteiro E.4, simulação).
# O LightGBM roda só aqui: não entra nas dependências da API nem da PoC. O relatório sai como
# artefato; quem o traz para docs/resultados é um commit com os arquivos baixados.
name: LightGBM (só na CI)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/lightgbm.yml"
      - "services/matching-api/app/ml_compare.py"
      - "services/matching-api/requirements-ml.txt"

permissions:
  contents: read

jobs:
  comparacao:
    name: Regressão logística contra LightGBM
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/matching-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/matching-api/requirements-ml.txt
      - run: pip install -r requirements-ml.txt
      - name: Gera os dados sintéticos
        run: python -m app.cli seed
      - name: Compara os modelos (simulação)
        run: python -m app.cli lightgbm --report-dir /tmp/lightgbm
      - name: Relatório no resumo do job
        run: cat /tmp/lightgbm/metricas-lightgbm.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: lightgbm
          path: /tmp/lightgbm
