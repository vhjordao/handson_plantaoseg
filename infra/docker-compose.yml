# PlantãoSeguro: Compose do servidor (Hostinger KVM 1), só para a apresentação (ADR 0009).
# Sobe a orquestração: n8n em modo fila (n8n + 1 worker), Redis, o Postgres PRÓPRIO do n8n e o Traefik,
# além da API de matching. O banco da aplicação é o Supabase, separado deste Compose.
# Publicar uma porta passa por cima do firewall: só 80 e 443 ficam abertas, o resto em 127.0.0.1.
# Uso: infra/README.md. Os segredos ficam no .env do servidor, nunca aqui.

# O nome vem do modelo da Hostinger: é ele que liga este arquivo aos volumes com os dados.
name: n8n

x-n8n-image: &n8n-image docker.n8n.io/n8nio/n8n:2.46.5

x-n8n-env: &n8n-env
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
  DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
  DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?defina N8N_DB_PASSWORD no .env}
  EXECUTIONS_MODE: queue
  QUEUE_BULL_REDIS_HOST: redis
  QUEUE_BULL_REDIS_PORT: "6379"
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?defina N8N_ENCRYPTION_KEY no .env}
  # O editor abre pela web, em HTTPS, no nome do servidor (ADR 0012). O nome fica só no .env.
  N8N_HOST: ${N8N_EDITOR_HOST:?defina N8N_EDITOR_HOST no .env}
  N8N_PROTOCOL: https
  N8N_EDITOR_BASE_URL: https://${N8N_EDITOR_HOST}/
  # Há um proxy na frente (o Traefik): o n8n lê o IP de quem chamou no cabeçalho que ele manda.
  N8N_PROXY_HOPS: "1"
  # A API chama o n8n por dentro do servidor, sem passar pela internet.
  WEBHOOK_URL: http://n8n:5678/
  N8N_RUNNERS_ENABLED: "true"
  GENERIC_TIMEZONE: America/Sao_Paulo
  TZ: America/Sao_Paulo
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  NODE_ENV: production

services:
  traefik:
    image: traefik:v3.7.17
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.mytlschallenge.acme.tlschallenge=true
      - --certificatesresolvers.mytlschallenge.acme.email=${SSL_EMAIL:?defina SSL_EMAIL no .env}
      - --certificatesresolvers.mytlschallenge.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik_data:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro

  postgres:
    # O modelo da Hostinger traz a 15, que o n8n não suporta mais: ele pede a 17 ou mais nova.
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${N8N_DB_NAME:-n8n}
      POSTGRES_USER: ${N8N_DB_USER:-n8n}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:?defina N8N_DB_PASSWORD no .env}
    volumes:
      - pgdata17:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:6.2.24
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  n8n:
    image: *n8n-image
    restart: unless-stopped
    environment:
      <<: *n8n-env
      N8N_PORT: "5678"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
    ports:
      # Reserva para o túnel SSH (infra/README.md): só no próprio servidor. A internet entra pelo Traefik.
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - traefik.enable=true
      # Só o editor vai à internet (ADR 0012). Webhooks (inclusive os de teste e de espera), formulários,
      # MCP e a API pública do n8n ficam fora da rota: a API de matching chama o n8n por dentro do
      # servidor, e o editor usa /rest.
      - traefik.http.routers.n8n.rule=Host(`${N8N_EDITOR_HOST:?defina N8N_EDITOR_HOST no .env}`) && !PathPrefix(`/webhook`) && !PathPrefix(`/form`) && !PathPrefix(`/mcp`) && !PathPrefix(`/api`)
      - traefik.http.routers.n8n.entrypoints=websecure
      - traefik.http.routers.n8n.tls.certresolver=mytlschallenge
      - traefik.http.routers.n8n.service=n8n
      # O login tem rota própria, com prioridade sobre a geral, para limitar as tentativas por IP de origem:
      # 5 por minuto, com rajada de 5.
      - traefik.http.routers.n8n-login.rule=Host(`${N8N_EDITOR_HOST}`) && Path(`/rest/login`) && Method(`POST`)
      - traefik.http.routers.n8n-login.priority=1000
      - traefik.http.routers.n8n-login.entrypoints=websecure
      - traefik.http.routers.n8n-login.tls.certresolver=mytlschallenge
      - traefik.http.routers.n8n-login.service=n8n
      - traefik.http.routers.n8n-login.middlewares=n8n-login-limite
      - traefik.http.middlewares.n8n-login-limite.ratelimit.average=5
      - traefik.http.middlewares.n8n-login-limite.ratelimit.period=1m
      - traefik.http.middlewares.n8n-login-limite.ratelimit.burst=5
      - traefik.http.services.n8n.loadbalancer.server.port=5678

  n8n-worker:
    image: *n8n-image
    restart: unless-stopped
    command: worker
    environment:
      <<: *n8n-env
    depends_on:
      - n8n

  matching-api:
    # A imagem é construída no próprio servidor, a partir da cópia da pasta (infra/README.md).
    image: plantaoseguro-matching-api:0.5.1
    build:
      context: ../services/matching-api
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?defina SUPABASE_URL no .env}
      # Ignora a RLS: existe só aqui, no .env do servidor, e nenhum outro serviço a recebe.
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?defina SUPABASE_SERVICE_ROLE_KEY no .env}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:?defina N8N_WEBHOOK_SECRET no .env}
      # Onde a API avisa que a cascata de uma vaga começou (ADR 0013). É por dentro do servidor.
      N8N_CASCADE_URL: http://n8n:5678/webhook/cascata-ofertas
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-}
      # Opcional: sem ela, a leitura e os motivos saem pelas regras (ADR 0003). Só a API a recebe.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_MODEL_EXTRACAO: ${LLM_MODEL_EXTRACAO:-gemini-3.1-flash-lite}
      LLM_REESCREVER_MOTIVOS: ${LLM_REESCREVER_MOTIVOS:-0}
      LLM_TETO_DIARIO: ${LLM_TETO_DIARIO:-100}
      LLM_TETO_POR_MINUTO: ${LLM_TETO_POR_MINUTO:-10}
    mem_limit: 512m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - traefik.enable=true
      # /internal fica fora da rota pública: o n8n chama a API por dentro do servidor.
      - traefik.http.routers.matching-api.rule=Host(`${API_HOST:?defina API_HOST no .env}`) && !PathPrefix(`/internal`)
      - traefik.http.routers.matching-api.entrypoints=websecure
      - traefik.http.routers.matching-api.tls.certresolver=mytlschallenge
      - traefik.http.routers.matching-api.middlewares=matching-api-limite,matching-api-corpo
      # Por IP de origem. A plateia pode sair toda pelo mesmo IP: o valor vem da medição (infra/README.md).
      - traefik.http.middlewares.matching-api-limite.ratelimit.average=${API_RATE_AVERAGE:-30}
      - traefik.http.middlewares.matching-api-limite.ratelimit.burst=${API_RATE_BURST:-60}
      - traefik.http.middlewares.matching-api-corpo.buffering.maxRequestBodyBytes=65536
      - traefik.http.services.matching-api.loadbalancer.server.port=8000

volumes:
  # Criados pelo modelo da Hostinger, fora do Compose. A conta do n8n e o certificado estão neles.
  traefik_data:
    external: true
  n8n_data:
    external: true
  pgdata17:
  redis_data:
