# PlantãoSeguro: Compose local (Fase 0).
# Sobe a orquestração: n8n em modo fila (n8n + worker), Redis e o Postgres PRÓPRIO do n8n.
# O banco da aplicação é o Supabase local (`supabase start`), separado deste Compose.
# Entram nas fases seguintes: matching-api (Fase 2), web (Fase 3) e Traefik/VPS (Etapa 3, deploy).
# Uso: make up   (equivale a: docker compose --env-file .env -f infra/docker-compose.yml up -d)

name: plantaoseguro

x-n8n-env: &n8n-env
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres-n8n
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
  DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
  DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?defina N8N_DB_PASSWORD no .env}
  EXECUTIONS_MODE: queue
  QUEUE_BULL_REDIS_HOST: redis
  QUEUE_BULL_REDIS_PORT: "6379"
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?defina N8N_ENCRYPTION_KEY no .env}
  WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
  GENERIC_TIMEZONE: America/Sao_Paulo
  TZ: America/Sao_Paulo
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"

services:
  postgres-n8n:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${N8N_DB_NAME:-n8n}
      POSTGRES_USER: ${N8N_DB_USER:-n8n}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:?defina N8N_DB_PASSWORD no .env}
    volumes:
      - postgres-n8n-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    restart: unless-stopped
    environment:
      <<: *n8n-env
      N8N_PORT: "5678"
      # Local em HTTP; em produção o Traefik termina o TLS e isto volta a ser true.
      N8N_SECURE_COOKIE: "false"
    ports:
      # Somente na máquina local: o editor do n8n nunca fica na internet pública.
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    volumes:
      - n8n-data:/home/node/.n8n
      - ../n8n/workflows:/workflows:ro
    depends_on:
      postgres-n8n:
        condition: service_healthy
      redis:
        condition: service_healthy

  n8n-worker:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    restart: unless-stopped
    command: worker
    environment:
      <<: *n8n-env
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      - n8n

volumes:
  postgres-n8n-data:
  n8n-data:
