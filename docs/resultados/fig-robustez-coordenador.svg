<title id="t">Ganho de tempo conforme o coordenador real</title><desc id="d">Colunas com o tempo economizado pelo modelo contra um coordenador que não confere a agenda, um que chama só quem pode ir e um que escolhe tão bem quanto o baseline.</desc>
