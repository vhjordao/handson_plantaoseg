<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>
<title id="t">Fluxo da solução: do texto da vaga à trilha de auditoria</title>
<desc id="d">Oito etapas em duas linhas. Da esquerda para a direita: pedido em texto livre, extração de campos por IA, conferência do coordenador, filtro de regras em código. Depois, da direita para a esquerda: ranking por IA, explicação, aprovação do coordenador e trilha de auditoria.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
</defs>
<rect width="880" height="380" fill="#fcfcfb"/>
<text x="20" y="30" font-size="16" font-weight="600" fill="#0b0b0b">Fluxo da solução: a IA recomenda, o humano decide</text>
<text x="20" y="50" font-size="12" fill="#52514e">Entrada, processamento de IA, saída e usuário em oito etapas</text>

<g stroke="#52514e" stroke-width="1.5" fill="none" marker-end="url(#a)">
<line x1="212" y1="115" x2="236" y2="115"/>
<line x1="432" y1="115" x2="456" y2="115"/>
<line x1="652" y1="115" x2="676" y2="115"/>
<line x1="775" y1="152" x2="775" y2="196"/>
<line x1="676" y1="245" x2="652" y2="245"/>
<line x1="456" y1="245" x2="432" y2="245"/>
<line x1="236" y1="245" x2="212" y2="245"/>
</g>

<g font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">
<rect x="20" y="78" width="190" height="74" rx="8" fill="#e1e0d9"/>
<text x="115" y="108" fill="#0b0b0b">1. Pedido em texto livre</text><text x="115" y="128" font-size="11" font-weight="400" fill="#52514e">entrada não confiável</text>

<rect x="240" y="78" width="190" height="74" rx="8" fill="#2a78d6"/>
<text x="335" y="108">2. Extração de campos</text><text x="335" y="128" font-size="11" font-weight="400">Gemini ou regras, validado</text>

<rect x="460" y="78" width="190" height="74" rx="8" fill="#eb6834"/>
<text x="555" y="108">3. Conferência</text><text x="555" y="128" font-size="11" font-weight="400">o coordenador confirma</text>

<rect x="680" y="78" width="190" height="74" rx="8" fill="#e1e0d9"/>
<text x="775" y="108" fill="#0b0b0b">4. Filtro de regras</text><text x="775" y="128" font-size="11" font-weight="400" fill="#52514e">código: CRM, raio, jornada</text>

<rect x="680" y="208" width="190" height="74" rx="8" fill="#2a78d6"/>
<text x="775" y="238">5. Ranking</text><text x="775" y="258" font-size="11" font-weight="400">regressão logística</text>

<rect x="460" y="208" width="190" height="74" rx="8" fill="#2a78d6"/>
<text x="555" y="238">6. Explicação</text><text x="555" y="258" font-size="11" font-weight="400">fatores; LLM só reescreve</text>

<rect x="240" y="208" width="190" height="74" rx="8" fill="#eb6834"/>
<text x="335" y="238">7. Aprovação</text><text x="335" y="258" font-size="11" font-weight="400">sem clique, sem oferta</text>

<rect x="20" y="208" width="190" height="74" rx="8" fill="#e1e0d9"/>
<text x="115" y="238" fill="#0b0b0b">8. Trilha de auditoria</text><text x="115" y="258" font-size="11" font-weight="400" fill="#52514e">só inserção, hash encadeado</text>
</g>

<g font-size="12" fill="#52514e">
<rect x="20" y="326" width="12" height="12" rx="2" fill="#2a78d6"/><text x="40" y="337">IA (modelo de linguagem ou de ranking)</text>
<rect x="300" y="326" width="12" height="12" rx="2" fill="#e1e0d9"/><text x="320" y="337">Código determinístico, testado</text>
<rect x="560" y="326" width="12" height="12" rx="2" fill="#eb6834"/><text x="580" y="337">Decisão humana</text>
</g>
<text x="20" y="366" font-size="11" fill="#898781">Simulação com dados sintéticos. As 8 etapas rodam na PoC (conferência e aprovação simuladas na demo); cascata e contestação são evolução futura.</text>
</svg>
