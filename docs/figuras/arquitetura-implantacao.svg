<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>
<title id="t">Arquitetura de implantação do PlantãoSeguro</title>
<desc id="d">A interface web na Vercel lê o Supabase sob RLS e escreve pela API de matching. A API e o n8n rodam no mesmo servidor, atrás do Traefik. A API usa a chave de serviço do Supabase, avisa o n8n uma vez por vaga e chama o Gemini sem dados pessoais. Integrações com CFM, CNES e sistemas do hospital são futuras.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a3935"/></marker>
</defs>
<rect width="880" height="360" fill="#ffffff"/>
<g stroke="#2a78d6" stroke-width="1.5" fill="#eef4fd">
<rect x="20" y="120" width="170" height="90" rx="8"/>
<rect x="300" y="20" width="200" height="110" rx="8"/>
<rect x="280" y="200" width="160" height="90" rx="8"/>
<rect x="480" y="200" width="150" height="90" rx="8"/>
<rect x="700" y="200" width="160" height="90" rx="8" fill="#f6f5f1" stroke="#6b6a66"/>
</g>
<rect x="260" y="170" width="390" height="140" rx="10" fill="none" stroke="#6b6a66" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="700" y="30" width="160" height="90" rx="8" fill="#ffffff" stroke="#6b6a66" stroke-width="1.2" stroke-dasharray="5 4"/>
<g fill="#0b0b0b" font-size="13" text-anchor="middle">
<text x="105" y="150" font-weight="700">Web · Next.js 16</text>
<text x="105" y="168">Vercel</text>
<text x="105" y="188" font-size="11.5" fill="#3a3935">coordenador, médico, telão</text>
<text x="400" y="48" font-weight="700">Supabase · São Paulo</text>
<text x="400" y="68">Postgres com RLS · Auth</text>
<text x="400" y="86">audit_log só de inserção</text>
<text x="400" y="104" font-size="11.5" fill="#3a3935">fonte da verdade dos dados</text>
<text x="360" y="232" font-weight="700">API de matching</text>
<text x="360" y="250">FastAPI</text>
<text x="360" y="268" font-size="11.5" fill="#3a3935">regras, ranking, aprovação</text>
<text x="555" y="232" font-weight="700">n8n</text>
<text x="555" y="250">modo fila</text>
<text x="555" y="268" font-size="11.5" fill="#3a3935">espera e cascata</text>
<text x="780" y="232" font-weight="700">Gemini</text>
<text x="780" y="250">extrai e redige</text>
<text x="780" y="268" font-size="11.5" fill="#3a3935">sem dados pessoais</text>
<text x="780" y="58" font-weight="700">Integrações futuras</text>
<text x="780" y="78">CFM (CRM) · CNES</text>
<text x="780" y="96" font-size="11.5" fill="#3a3935">escala e financeiro do hospital</text>
</g>
<g fill="#3a3935" font-size="11.5">
<text x="270" y="188">Servidor Hostinger KVM 1 · Traefik, HTTPS e limite de requisições</text>
<text x="196" y="92">lê sob RLS</text>
<text x="168" y="262" text-anchor="end">escreve pela API (JWT)</text>
<text x="368" y="168">chave de serviço, só no servidor</text>
<text x="508" y="165" text-anchor="middle" fill="#3a3935"> </text>
<text x="520" y="62" text-anchor="middle" fill="#3a3935"> </text>
<text x="600" y="68" text-anchor="middle">importa (futuro)</text>
<text x="560" y="344" text-anchor="middle">extrai campos e explica, sem ferramentas e sem segredos</text>
<text x="460" y="214" text-anchor="middle">avisa</text>
<text x="460" y="283" text-anchor="middle">avança</text>
</g>
<g stroke="#3a3935" stroke-width="1.5" fill="none" marker-end="url(#a)">
<path d="M190,140 L300,92"/>
